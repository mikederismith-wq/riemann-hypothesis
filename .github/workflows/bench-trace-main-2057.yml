name: Recheck the shared trace proof after batch 2057
on:
  push:
    branches: [bench/trace-main-2057]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-only-trace-main-2057
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'mikederismith-wq/riemann-hypothesis' && github.ref == 'refs/heads/bench/trace-main-2057'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: bench-trace-main
      - name: Rebuild paired producers and check their direct importers
        timeout-minutes: 50
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rh-proof-results"
          python3 bench-trace-main/run.py 2>&1 | tee "$RUNNER_TEMP/rh-proof-results/run.log"
      - name: Preserve compiler measurements and proof-checking logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trace-main-2057-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh-proof-results
          retention-days: 7
