name: Check the default RH build with the joint Harris–Taylor basis
on:
  push:
    branches: [bench/harris-taylor-default]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-harris-taylor-default
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'mikederismith-wq/riemann-hypothesis' && github.ref == 'refs/heads/bench/harris-taylor-default'
    runs-on: ubuntu-24.04
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: harris-default
      - name: Build every default Lake target on the exact production tree
        timeout-minutes: 135
        run: python3 harris-default/check.py
      - name: Save module, public-interface and resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harris-default-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh-proof-results
          if-no-files-found: warn
          retention-days: 7
