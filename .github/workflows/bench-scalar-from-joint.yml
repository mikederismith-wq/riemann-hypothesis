name: Check the scalar Kodaira–Spencer realisation from the joint lift
on:
  push:
    branches: [bench/scalar-from-joint-probe]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-scalar-from-joint-probe
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'mikederismith-wq/riemann-hypothesis' && github.ref == 'refs/heads/bench/scalar-from-joint-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scalar-probe
      - name: Elaborate the standalone example
        run: python3 scalar-probe/check.py
      - name: Save proof diagnostics and exact input identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scalar-from-joint-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh-scalar-result
          if-no-files-found: error
          retention-days: 7
