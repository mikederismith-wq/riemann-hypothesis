name: Check the shared monomial slice signatures
on:
  push:
    branches: [bench/tieops-kernel-signatures]
  workflow_dispatch:
concurrency:
  group: fork-only-tieops-kernel-signatures
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'mikederismith-wq/riemann-hypothesis' && github.ref == 'refs/heads/bench/tieops-kernel-signatures'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: kernel-check
      - name: Compare compiled public signatures with the Lean kernel
        timeout-minutes: 65
        run: python3 kernel-check/verify.py
      - name: Preserve the kernel checks and compiler logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tieops-kernel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh-proof-results
          if-no-files-found: warn
          retention-days: 7
