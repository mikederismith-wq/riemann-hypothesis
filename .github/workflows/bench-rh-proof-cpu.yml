name: Measure the trace and CovMain proofs
on:
  push:
    branches: [bench/proof-cpu-b12]
  workflow_dispatch:
concurrency:
  group: fork-only-proof-cpu-b12
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'mikederismith-wq/riemann-hypothesis' && github.ref == 'refs/heads/bench/proof-cpu-b12'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: proof-bench
      - name: Check and time the pinned proof variants
        timeout-minutes: 75
        run: python3 proof-bench/proof.py
      - name: Preserve individual compiler timings and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proof-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rh-proof-results
          if-no-files-found: warn
          retention-days: 7
